<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="calculo.js/script.js" defer></script>
    <title>Proyecto</title>
</head>
<body>
    <div class="container">
        <h1>Pago de trabajadores</h1>
        <label for="nombre">¿Cuál es el nombre del trabajador?</label>
        <input class="form-control" type="text" id="nombre" name="nombre" placeholder="Nombre">
        <label for="sueldo">¿Cuánto es el sueldo del trabajador?</label>
        <input class="form-control" type="number" id="sueldo" name="sueldo" placeholder="Sueldo">
        <label for="antiguedad">¿Cuántos meses de antigüedad tiene el trabajador?</label>
        <input class="form-control" type="number" id="antiguedad" name="antiguedad" placeholder="Antigüedad">
        <br>
        <div class="d-grid gap-2">
            <button class="btn btn-outline-danger" type="submit" onclick="calcular()">Calcular</button>
        </div>
        <br>
        <h2>Resultados</h2>
        <p><span id="nombre_resultado"></span></p>
        <p><span id="bono_total"></span></p>
        <p><span id="sueldo_total"></span></p>
    </div>
</body>
</html>
